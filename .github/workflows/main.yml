# .github/workflows/android-release.yml

name: Android Release Build

# 定义何时触发这个工作流
on:
  push:
    branches:
      - main  # 仅在代码推送到 'main' 分支时触发
      # 您也可以在这里添加其他分支，例如：
      # - develop
  pull_request:
    branches:
      - main  # 仅在与 'main' 分支的 Pull Request 相关时触发

jobs:
  build_apk:
    name: Build Release APK
    runs-on: ubuntu-latest # 使用最近的 GitHub Actions Runner 实例 (Ubuntu)

    steps:
      # 1. 检出代码
      # 这个步骤会将您的 GitHub 仓库代码克隆到 Runner 的工作目录中。
      - name: Checkout Code
        uses: actions/checkout@v4 # 使用最新版本的 checkout action 很好，@v3 也可以

      # 2. 设置 Java 环境
      # 这个步骤会安装并配置 JDK 17，这是很多 Android 项目需要的版本。
      # 'cache: 'gradle'' 会缓存 Gradle 依赖，显著加快后续构建的速度。
      - name: Set up JDK 17
        uses: actions/setup-java@v4 # 使用最新版本的 setup-java action
        with:
          distribution: 'temurin' # 使用 Temurin distribution (开源、无限制)
          java-version: '17'     # 指定 Java 版本为 17
          cache: 'gradle'        # 启用 Gradle 缓存

      # 3. 赋予 gradlew 可执行权限
      # 在 Linux/macOS 环境中，脚本文件需要有执行权限才能运行。
      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      # 4. 执行 Gradle 构建命令
      # 这是核心步骤，它会运行 Gradle 来构建 release APK。
      # 假设您的 Android 项目的 'gradlew' 文件在仓库的根目录。
      # 如果您的 'gradlew' 在 'app/' 目录下，命令将是 './app/gradlew assembleRelease'
      - name: Build Release APK
        run: |
          echo "🚀 Starting Android Release APK build..."
          # 运行 Gradle assembleRelease 命令
          # 您也可以在这里添加其他 Gradle 参数，例如：-PsomeProperty=value
          ./gradlew assembleRelease
          echo "✅ Android Release APK build completed."

      # 5. (可选) 上传构建的 APK
      # 如果您想将生成的 APK 文件作为构建的产物下载，可以启用此步骤。
      # 默认情况下，release APK 位于 app/build/outputs/apk/release/app-release.apk
      # 如果您的项目有所不同，需要修改 'path' 字段。
      - name: Upload Release APK
        uses: actions/upload-artifact@v4 # 使用最新版本的 upload-artifact action
        with:
          name: release-apk # 上传产物的名称，您可以在 Actions 界面看到
          path: app/build/outputs/apk/release/app-release.apk # APK 文件的路径
          # 如果您有多个 release APK，可以这样添加:
          # path: |
          #   app/build/outputs/apk/release/app-release.apk
          #   app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error # 如果找不到指定路径的文件，则此步骤会报错

